# Render Blueprint -- https://render.com/docs/blueprint-spec
#
# Provisions skillswap-api (FastAPI + WebSockets) and a managed Postgres
# database. This is why the backend can't live on Netlify/Vercel: those
# only run short-lived serverless functions, and SkillSwap depends on
# persistent WebSocket connections (chat/video signaling/presence), which
# a serverless function can't hold open.
#
# skillswap-api runs on Render's free web-service tier (spins down when
# idle, cold-starts on the next request).
#
# No separate Celery worker/beat service here -- Render's Background
# Worker service type has no free tier at all, so this file defaults to
# the free path instead: CELERY_TASK_ALWAYS_EAGER=true makes .delay()/
# .apply_async() calls run synchronously in this same web service, and
# .github/workflows/scheduled-sweeps.yml stands in for Celery Beat's
# schedule via a free GitHub Actions cron hitting two secret-protected
# internal endpoints. See DEPLOYMENT.md for the full explanation and the
# tradeoffs (mainly: session-reminder emails, which rely on Celery's
# future-dated `eta` scheduling, don't fire on this path -- see the
# comment in app/api/routes/swap_requests.py). If you'd rather pay
# Render's ~$7/mo Background Worker price for a real worker+beat process
# and get that feature back, DEPLOYMENT.md also documents how to add that
# service back in.
#
# Redis is deliberately NOT provisioned here -- Render's managed Redis
# blueprint syntax has changed over time and this file would risk going
# stale silently. Create it once by hand in the Render dashboard (New +
# -> Redis/Key Value, a couple of clicks) and paste its connection string
# into the REDIS_URL env var below (marked `sync: false`, i.e. set
# manually in the dashboard, not tracked in this file). Still needed even
# on the free/eager path above -- Redis also backs rate limiting, caching,
# and pending-signup OTP storage, not just Celery. See DEPLOYMENT.md for
# the full walkthrough.

services:
  # --- FastAPI + Uvicorn, serving both the REST API and the WebSocket
  # endpoints (chat, video signaling, presence, notifications). Runs the
  # Alembic migration as part of the start command so the schema is
  # always current before the server actually starts accepting traffic. ---
  - type: web
    name: skillswap-api
    runtime: python
    rootDir: backend
    plan: free # Render's free web-service tier spins down after 15 min idle
               # and cold-starts on the next request -- fine for now; bump to
               # starter if that cold-start latency becomes a real problem.
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skillswap-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true" # free-tier path, no separate worker -- see top-of-file comment
      - key: INTERNAL_SWEEP_SECRET
        generateValue: true # copy this into your GitHub repo's SWEEP_SECRET Actions secret
      - key: FRONTEND_ORIGIN
        sync: false # your Netlify URL, e.g. https://skillswap.netlify.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false # https://<this-service>.onrender.com/api/auth/google/callback
      - key: EMAIL_BACKEND
        value: console # flip to "smtp" once MAIL_* below are filled in for real
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: SkillSwap
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_SSL_TLS
        value: "false"
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: OTP_LENGTH
        value: "6"
      - key: OTP_EXPIRE_MINUTES
        value: "5"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_UPLOAD_MB
        value: "10"

# Want a real worker+beat process instead of the free eager+cron path above
# (e.g. to get session-reminder emails working, or just to move task
# execution off the request path)? Add this service back and pay Render's
# Starter tier (~$7/mo, the cheapest Background Worker option) for it, then
# set CELERY_TASK_ALWAYS_EAGER back to "false" on skillswap-api above and
# disable/delete .github/workflows/scheduled-sweeps.yml:
