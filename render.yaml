# Render Blueprint -- https://render.com/docs/blueprint-spec
#
# Provisions the long-running processes SkillSwap's backend actually needs
# (a real web service for FastAPI + WebSockets, plus one combined worker+beat
# process for Celery) and a managed Postgres database. This is why the
# backend can't live on Netlify/Vercel: those only run short-lived
# serverless functions, and SkillSwap depends on persistent WebSocket
# connections (chat/video signaling/presence) and a continuously-running
# Celery worker + beat scheduler (email sends, the hourly credit-escrow
# sweep, the daily skill-waitlist sweep) -- none of which a serverless
# function can do.
#
# skillswap-api runs on Render's free web-service tier (spins down when
# idle, cold-starts on the next request). skillswap-worker is on the
# cheapest paid tier (Starter, ~$7/mo) because Render's Background Worker
# service type has no free option at all -- there's no idle-traffic signal
# to spin it down on the way there is for a web service. Worker and beat
# are merged into that one service (see its comment below) specifically to
# avoid paying for two of them.
#
# Redis is deliberately NOT provisioned here -- Render's managed Redis
# blueprint syntax has changed over time and this file would risk going
# stale silently. Create it once by hand in the Render dashboard (New +
# -> Redis, a couple of clicks) and paste its connection string into the
# REDIS_URL / CELERY_BROKER_URL / CELERY_RESULT_BACKEND env vars below
# (marked `sync: false`, i.e. set manually in the dashboard, not tracked
# in this file). See DEPLOYMENT.md for the full walkthrough.

services:
  # --- FastAPI + Uvicorn, serving both the REST API and the WebSocket
  # endpoints (chat, video signaling, presence, notifications). Runs the
  # Alembic migration as part of the start command so the schema is
  # always current before the server actually starts accepting traffic. ---
  - type: web
    name: skillswap-api
    runtime: python
    rootDir: backend
    plan: free # Render's free web-service tier spins down after 15 min idle
               # and cold-starts on the next request -- fine for now; bump to
               # starter if that cold-start latency becomes a real problem.
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skillswap-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false # your Netlify URL, e.g. https://skillswap.netlify.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false # https://<this-service>.onrender.com/api/auth/google/callback
      - key: EMAIL_BACKEND
        value: console # flip to "smtp" once MAIL_* below are filled in for real
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: SkillSwap
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_SSL_TLS
        value: "false"
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: OTP_LENGTH
        value: "6"
      - key: OTP_EXPIRE_MINUTES
        value: "5"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_UPLOAD_MB
        value: "10"

  # --- Celery worker + beat, combined into one process. Handles everything
  # queued via .delay()/.apply_async() (OTP/reset/reminder emails, badge
  # awarding, waitlist notifications) AND fires the scheduled sweeps itself
  # (hourly credit-escrow release, daily skill-waitlist sweep) via the -B
  # flag, instead of running beat as a separate service. Render's
  # Background Worker service type has no free tier at all (unlike the web
  # service above), so this is billed no matter what -- merging worker and
  # beat into one service instead of two is purely to avoid paying for a
  # second one, since a solo beat process barely uses any resources anyway. ---
  - type: worker
    name: skillswap-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.celery_app worker --beat --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skillswap-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: JWT_SECRET_KEY
        sync: false # same value as skillswap-api's -- copy it over after that service's first deploy
      - key: EMAIL_BACKEND
        value: console
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: SkillSwap
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_SSL_TLS
        value: "false"

databases:
  - name: skillswap-db
    plan: free
    databaseName: skillswap
    user: skillswap
