#       - key: ENVIRONMENT
#         value: production
#       - key: DATABASE_URL
#         fromDatabase:
#           name: skillswap-db
#           property: connectionString
#       - key: REDIS_URL
#         sync: false
#       - key: CELERY_BROKER_URL
#         sync: false
#       - key: CELERY_RESULT_BACKEND
#         sync: false
#       - key: JWT_SECRET_KEY
#         sync: false # same value as skillswap-api's
#       - key: EMAIL_BACKEND
#         value: console
#       - key: MAIL_USERNAME
#         sync: false
#       - key: MAIL_PASSWORD
#         sync: false
#       - key: MAIL_FROM
#         sync: false
#       - key: MAIL_FROM_NAME
#         value: SkillSwap
#       - key: MAIL_SERVER
#         sync: false
#       - key: MAIL_PORT
#         value: "587"
#       - key: MAIL_STARTTLS
#         value: "true"
#       - key: MAIL_SSL_TLS
#         value: "false"

databases:
  - name: skillswap-db
    plan: free
    databaseName: skillswap
    user: skillswap
