name: Scheduled sweeps

# Stand-in for Celery Beat on the free-tier deploy path (see DEPLOYMENT.md),
# which has no separate skillswap-worker process to run app/celery_app.py's
# beat_schedule on its own. Hits the two secret-protected internal
# endpoints in backend/app/api/routes/internal.py on the same cadence Beat
# would have used them: hourly credit-escrow release, daily waitlist sweep.
#
# Not needed at all if you're paying for a real skillswap-worker service --
# that one runs `celery ... worker --beat`, which already does this itself.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   RENDER_API_URL   e.g. https://skillswap-dunf.onrender.com (no trailing slash)
#   SWEEP_SECRET      must match INTERNAL_SWEEP_SECRET on skillswap-api
#
# Note: GitHub disables scheduled workflows automatically after 60 days
# with no commits to the repo -- push something (or re-enable it manually
# from the Actions tab) if the sweeps quietly stop firing after a long
# quiet period.

on:
  workflow_dispatch: {}  # lets you trigger either job manually from the Actions tab to test

jobs:
  credit-escrow-sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger credit-escrow sweep
        run: |
          curl -sS -f -X POST "${{ secrets.RENDER_API_URL }}/api/internal/sweeps/credit-escrow" \
            -H "X-Sweep-Secret: ${{ secrets.SWEEP_SECRET }}"

  waitlist-sweep:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger waitlist sweep
        run: |
          curl -sS -f -X POST "${{ secrets.RENDER_API_URL }}/api/internal/sweeps/waitlist" \
            -H "X-Sweep-Secret: ${{ secrets.SWEEP_SECRET }}"
